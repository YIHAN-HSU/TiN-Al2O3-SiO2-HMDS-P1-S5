name: public-deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build public image
        run: docker build -t p1-s5-public .
      - name: TypeScript check
        run: docker run --rm --read-only --tmpfs /tmp p1-s5-public npm run lint
      - name: Original-model and public-mode regression
        run: docker run --rm --read-only --tmpfs /tmp p1-s5-public npm run test:public
      - name: Server-side access-control regression
        run: docker run --rm --read-only --tmpfs /tmp p1-s5-public npm run test:auth
      - name: HTTP acceptance
        run: docker run --rm --read-only --tmpfs /tmp p1-s5-public npm run test:http:secure
      - name: Show service log on failure
        if: failure()
        run: echo "Review the failed test step above (credential values are never emitted)."
