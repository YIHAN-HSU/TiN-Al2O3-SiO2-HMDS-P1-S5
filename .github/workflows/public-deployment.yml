name: public-deployment
on: [push, pull_request]
permissions:
  contents: read
jobs:
  docker-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Build public image
        run: docker build -t p1-s5-public .
      - name: Original-model and public-mode regression
        run: docker run --rm --read-only --tmpfs /tmp p1-s5-public npm run test:public
      - name: HTTP acceptance
        run: |
          docker run -d --name p1-s5-public --read-only --tmpfs /tmp -p 10000:10000 p1-s5-public
          for i in $(seq 1 60); do curl --fail --silent http://localhost:10000/healthz && break || sleep 2; done
          curl --fail --silent http://localhost:10000/ > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://localhost:10000/api/history)" = 404
          curl --fail --silent -H 'Content-Type: application/json' --data '{"input_type":"SMILES","raw_text":"CCO","substrates":["TiN","Al2O3","SiO2","HMDS_SiO2"]}' http://localhost:10000/api/analyze > /tmp/result.json
          python3 -c "import json; r=json.load(open('/tmp/result.json')); assert len(r['integrated_results']['rows'])==4; assert all(x['final']['value'] is not None for x in r['integrated_results']['rows'])"
      - name: Show service log on failure
        if: failure()
        run: docker logs p1-s5-public || true
